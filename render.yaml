# Render Blueprint: New + > Blueprint > pick this repo. Secrets are entered in the dashboard, never committed.
services:
  - type: web
    name: ideavault
    runtime: docker
    plan: free
    region: virginia # keep it next to the Neon database (AWS us-east-1)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__Default
        sync: false # paste the Neon connection string
      - key: APP_PASSWORD
        sync: false # your login password
      - key: JWT_SECRET
        generateValue: true # random 256-bit secret generated by Render
