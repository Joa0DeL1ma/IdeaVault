# Local development database. Run: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: ideavault-db
    environment:
      POSTGRES_DB: ideavault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ideavault-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideavault"]
      interval: 5s
      retries: 5

volumes:
  ideavault-data:
